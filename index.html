<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปิดให้บริการ - หมดเขตหรือปิดระบบชั่วคราว</title>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #18181b 100%, #27272a 0%);
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(39, 39, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }

        .icon-box {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 15px;
            color: #a1a1aa;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .deadline-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .contact-btn {
            display: inline-block;
            background: #5865F2; /* สีประจำแบรนด์ Discord */
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
        }

        .contact-btn:hover {
            background: #4752C4;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">⏳</div>
        
        <h1>ปิดให้บริการชั่วคราว / สิ้นสุดระยะเวลา</h1>
        
        <p>
            ระบบนี้ได้ปิดให้บริการชั่วคราว หรืออาจจะหมดเขตการใช้งานตามกำหนดเวลาเรียบร้อยแล้วครับ ขอบคุณทุกท่านที่ให้ความสนใจ
        </p>

        <div class="deadline-box">
            📅 สถานะ: ปิดรับการใช้งาน / หมดเขตแล้ว
        </div>

        <a href="mailto:pikulkaw.pp@gmail.com?subject=ติดต่อสอบถามเกี่ยวกับระบบ" class="contact-btn">ติดต่อผู้ดูแลระบบ (Gmail)</a>
        <!-- ปุ่มลิงก์ไป Discord -->
        <a href="https://discord.gg/QTfFrS4g" target="_blank" class="contact-btn">ติดต่อผู้ดูแลระบบ (Discord)</a>
    </div>

</body>
</html>
