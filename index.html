<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบคัดเลือกเข้ากรมยุทธศึกษาทหารเรือ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- 1. หน้าแรก (Welcome Screen) -->
        <div id="start-screen" class="screen">
            <img src="47-2.png" alt="กรมยุทธศึกษาทหารเรือ" class="main-logo">
            <h1>ข้อสอบคัดเลือกเข้ากรมยุทธศึกษาทหารเรือ</h1>
            <p class="info-text">จำนวน 40 ข้อ | คะแนนเต็ม 40 คะแนน</p>
            <p class="info-detail">เกณฑ์การผ่าน: ได้รับคะแนน 60% ขึ้นไป (24 คะแนน)</p>
            <button type="button" class="btn-primary" onclick="goToRegister()">📘 เริ่มต้นทำแบบทดสอบ</button>
        </div>

        <!-- 2. หน้ากรอกข้อมูลผู้สอบ (Register Screen) -->
        <div id="register-screen" class="screen" style="display: none;">
            <img src="47-2.png" alt="กรมยุทธศึกษาทหารเรือ" class="main-logo">
            <h2>กรอกข้อมูลผู้เข้ารับการทดสอบ</h2>
            <form id="user-info-form" onsubmit="startQuiz(event)">
                <div class="form-group">
                    <label for="roblox-name">ยศ - ชื่อ Roblox:</label>
                    <input type="text" id="roblox-name" required placeholder="เช่น พลฯ สมชาย (หรือชื่อในเกม)">
                </div>
                <button type="submit" class="btn-primary">✍️ เข้าสู่หน้าทำข้อสอบ</button>
            </form>
        </div>

        <!-- 3. หน้าทำข้อสอบ (Quiz Screen) -->
        <div id="quiz-screen" class="screen" style="display: none;">
            <header class="header">
                <img src="47-2.png" alt="กรมยุทธศึกษาทหารเรือ" class="logo">
                <h1>ข้อสอบคัดเลือกเข้ากรมยุทธศึกษาทหารเรือ</h1>
                <p class="subtitle" id="user-greeting"></p>
            </header>

            <form id="quiz-form">
                <div id="questions-container"></div>
                <button type="button" id="submit-btn" onclick="calculateScore()">ส่งข้อสอบ / ตรวจคะแนน</button>
            </form>
        </div>

        <!-- Modal สรุปผลสอบ -->
        <div id="result-modal" class="modal">
            <div class="modal-content" id="capture-area">
                <img src="47-2.png" alt="กรมยุทธศึกษาทหารเรือ" class="modal-logo">
                <h2>ผลการสอบ</h2>
                <div id="status-badge"></div>
                <p id="result-name" style="font-weight: bold; color: #0a2540; margin-bottom: 5px;"></p>
                <p id="score-text"></p>
                <p id="percentage-text"></p>
                <p id="save-status" style="font-size: 13px; color: #16a34a; margin-top: 5px;"></p>
                
                <div class="button-group">
                    <button type="button" class="btn-download" onclick="downloadResultImage()">
                        📸 บันทึกผลสอบเป็นรูปภาพ
                    </button>
                    <button type="button" class="btn-restart" onclick="location.reload()">
                        ทำแบบทดสอบอีกครั้ง
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
